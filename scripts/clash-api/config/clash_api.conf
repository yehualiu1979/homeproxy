#!/bin/bash
# Clash API 安装配置
# 版本: 1.0.0
# 更新日期: 2026-04-04

# 项目路径配置
# 自动检测项目根目录
if [ -z "${PROJECT_ROOT}" ]; then
    # 尝试从 GITHUB_WORKSPACE 环境变量获取（GitHub Actions）
    if [ -n "${GITHUB_WORKSPACE}" ]; then
        PROJECT_ROOT="${GITHUB_WORKSPACE}"
    # 尝试从脚本位置推断
    elif [ -n "${BASH_SOURCE}" ]; then
        SCRIPT_DIR_ABS="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        PROJECT_ROOT="$(cd "${SCRIPT_DIR_ABS}/../../../" && pwd)"
    else
        # 回退到硬编码路径（仅用于本地测试）
        PROJECT_ROOT="/home/yehualiu/homeproxy"
    fi
fi

# 脚本目录
SCRIPT_DIR="${PROJECT_ROOT}/scripts/clash-api"

# 文件路径配置
GENERATE_CLIENT_UC="${PROJECT_ROOT}/root/etc/homeproxy/scripts/generate_client.uc"
CLIENT_JS="${PROJECT_ROOT}/htdocs/luci-static/resources/view/homeproxy/client.js"
UCI_CONFIG="${PROJECT_ROOT}/root/etc/config/homeproxy"

# Clash API 默认配置
CLASH_API_ENABLED="0"
CLASH_API_CONTROLLER="127.0.0.1:9090"
CLASH_API_UI="/etc/homeproxy/ui/"
CLASH_API_UI_DETOUR=""
CLASH_API_DEFAULT_MODE="rule"
CLASH_API_SECRET=""

# sing-box 版本要求
SINGBOX_MIN_VERSION="1.8.0"
SINGBOX_RECOMMENDED_VERSION="1.9.0"

# 备份配置
BACKUP_DIR="/tmp/homeproxy_clash_api_backup"
BACKUP_RETENTION_DAYS=7

# 验证选项
ENABLE_VERIFICATION="true"
ENABLE_BACKUP="true"
ENABLE_ROLLBACK="true"

# 日志配置
LOG_FILE="/tmp/homeproxy_clash_api_install.log"
LOG_LEVEL="INFO"  # DEBUG, INFO, WARN, ERROR

# 兼容性设置
ALLOW_MINOR_VERSION_UPGRADE="true"
ALLOW_CONFIG_MIGRATION="true"