name: Sync Upstream and Clean

on:
  schedule:
    - cron: '0 22 * * 2'  # 每周三北京时间早上6点（UTC周二22:00）
  workflow_dispatch:  # 支持手动触发

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_hash.outputs.commit_hash }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get commit hash before sync
        id: get_hash
        run: |
          # 获取 master 分支的最新 commit hash
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "同步前的 commit: ${COMMIT_HASH}"

      - name: Sync upstream changes
        uses: aormsby/fork-sync-with-upstream-action@v3.4
        with:
          upstream_sync_repo: immortalwrt/homeproxy   #更改用户名和仓库名可同步
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

  restore-custom-files:
    runs-on: ubuntu-latest
    needs: sync
    if: success()
    steps:
      - name: Checkout code after sync
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore custom files from git history
        run: |
          # 从上一次提交中恢复自定义文件
          COMMIT_HASH="${{ needs.sync.outputs.commit_hash }}"
          
          echo "从 commit ${COMMIT_HASH} 恢复自定义文件..."
          
          # 恢复 workflow 文件
          git show "${COMMIT_HASH}:.github/workflows/Upstream&Clean.yml" > .github/workflows/Upstream&Clean.yml || echo "Upstream&Clean.yml 不存在于历史中"
          git show "${COMMIT_HASH}:.github/workflows/test-clash-api-scripts.yml" > .github/workflows/test-clash-api-scripts.yml || echo "test-clash-api-scripts.yml 不存在于历史中"
          
          # 恢复 scripts/clash-api/ 目录
          if [ -f ".github/workflows/Upstream&Clean.yml" ]; then
            mkdir -p scripts
            git archive "${COMMIT_HASH}" -- scripts/clash-api | tar -x -C scripts || echo "scripts/clash-api/ 不存在于历史中"
          fi
          
          echo "恢复完成"
          ls -la .github/workflows/

      - name: Commit and push restored files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .github/workflows/Upstream&Clean.yml .github/workflows/test-clash-api-scripts.yml scripts/clash-api/ || true
          
          if git diff --cached --quiet; then
            echo "没有文件需要恢复或文件已存在"
          else
            git commit -m "chore: 恢复自定义 workflow 和脚本

            - 恢复 Upstream&Clean.yml
            - 恢复 test-clash-api-scripts.yml  
            - 恢复 scripts/clash-api/ 目录
            "
            git push origin master
          fi

  clean-workflows:
    runs-on: ubuntu-22.04
    needs: restore-custom-files  # 等待恢复任务完成后再清理
    if: success()  # 仅当恢复成功时执行清理
    steps:
      - name: Delete all workflow run histories
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          workflows_keep_day: 0