name: Test Clash API Scripts

on:
  workflow_run:
    workflows: ['Sync Upstream and Clean']
    types: [completed]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 基础语法检查
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          echo "检查所有 Shell 脚本语法..."
          find scripts/clash-api -name "*.sh" -type f -exec bash -n {} \; && echo "✓ 所有脚本语法正确" || exit 1

      - name: Check for common errors
        run: |
          echo "检查常见错误..."
          
          # 检查是否有未设置的变量引用
          if grep -r '${[^}]*}' scripts/clash-api/*.sh scripts/clash-api/lib/*.sh | grep -v '^\s*#'; then
            echo "⚠️  发现可能未设置的变量引用"
          fi
          
          # 检查是否有 Windows 行尾符
          if find scripts/clash-api -name "*.sh" -type f -exec file {} \; | grep -i crlf; then
            echo "⚠️  发现 Windows 行尾符文件"
            exit 1
          fi
          
          echo "✓ 常见错误检查通过"

  # 脚本逻辑测试
  script-logic-test:
    name: Script Logic Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils

      - name: Test configuration loading
        run: |
          echo "测试配置文件加载..."
          source scripts/clash-api/config/clash_api.conf
          
          # 验证关键变量
          REQUIRED_VARS=("PROJECT_ROOT" "SCRIPT_DIR" "GENERATE_CLIENT_UC" "CLIENT_JS" "UCI_CONFIG")
          all_vars_set=true
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              echo "  ✗ 必需变量 ${var} 未设置"
              all_vars_set=false
            else
              echo "  ✓ ${var}: ${!var}"
            fi
          done
          
          if [ "${all_vars_set}" = "true" ]; then
            echo "✓ 配置文件加载成功"
          else
            echo "✗ 配置文件加载失败"
            exit 1
          fi

      - name: Test common library
        run: |
          echo "测试通用函数库..."
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/common.sh
          
          # 测试日志函数
          log_info "测试日志功能"
          echo "✓ 通用函数库加载成功"

      - name: Test backup functionality
        run: |
          echo "测试备份功能..."
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/common.sh
          
          # 模拟创建测试文件
          TEST_DIR=$(mktemp -d)
          mkdir -p "${TEST_DIR}/root/etc/homeproxy/scripts"
          mkdir -p "${TEST_DIR}/htdocs/luci-static/resources/view/homeproxy"
          mkdir -p "${TEST_DIR}/root/etc/config"
          
          echo "test" > "${TEST_DIR}/root/etc/homeproxy/scripts/generate_client.uc"
          echo "test" > "${TEST_DIR}/htdocs/luci-static/resources/view/homeproxy/client.js"
          echo "test" > "${TEST_DIR}/root/etc/config/homeproxy"
          
          # 临时修改路径
          GENERATE_CLIENT_UC="${TEST_DIR}/root/etc/homeproxy/scripts/generate_client.uc"
          CLIENT_JS="${TEST_DIR}/htdocs/luci-static/resources/view/homeproxy/client.js"
          UCI_CONFIG="${TEST_DIR}/root/etc/config/homeproxy"
          
          # 测试备份
          BACKUP_DIR=$(create_backup)
          if [ -d "${BACKUP_DIR}" ]; then
            echo "✓ 备份功能正常"
            ls -lh "${BACKUP_DIR}"
          else
            echo "✗ 备份功能失败"
            exit 1
          fi
          
          # 清理
          rm -rf "${TEST_DIR}" "${BACKUP_DIR}"

      - name: Test version checking
        run: |
          echo "测试版本检查功能..."
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/version_checker.sh
          
          # 测试版本比较 - 相等
          result=$(compare_versions "1.8.0" "1.8.0")
          if [ "${result}" = "equal" ]; then
            echo "  ✓ 相等测试通过"
          else
            echo "  ✗ 相等测试失败: ${result}"
            exit 1
          fi
          
          # 测试版本比较 - 大于
          result=$(compare_versions "1.9.0" "1.8.0")
          if [ "${result}" = "greater" ]; then
            echo "  ✓ 大于测试通过"
          else
            echo "  ✗ 大于测试失败: ${result}"
            exit 1
          fi
          
          # 测试版本比较 - 小于
          result=$(compare_versions "1.8.0" "1.9.0")
          if [ "${result}" = "less" ]; then
            echo "  ✓ 小于测试通过"
          else
            echo "  ✗ 小于测试失败: ${result}"
            exit 1
          fi
          
          echo "✓ 版本比较功能正常"

      - name: Test config generation
        run: |
          echo "测试配置生成..."
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/config_manager.sh
          
          # 生成配置
          CONFIG=$(generate_uci_config)
          if echo "${CONFIG}" | grep -q "config homeproxy 'clash_api'"; then
            echo "✓ 配置生成功能正常"
            echo "${CONFIG}"
          else
            echo "✗ 配置生成功能失败"
            exit 1
          fi

      - name: Test file modification
        run: |
          echo "测试文件修改功能..."
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/common.sh
          source scripts/clash-api/lib/file_modifier.sh
          
          # 复制测试文件
          cp root/etc/homeproxy/scripts/generate_client.uc /tmp/generate_client.uc.test
          cp htdocs/luci-static/resources/view/homeproxy/client.js /tmp/client.js.test
          
          # 临时修改路径
          ORIGINAL_GENERATE_CLIENT_UC="${GENERATE_CLIENT_UC}"
          ORIGINAL_CLIENT_JS="${CLIENT_JS}"
          GENERATE_CLIENT_UC="/tmp/generate_client.uc.test"
          CLIENT_JS="/tmp/client.js.test"
          
          # 执行修改
          modify_generate_client_uc
          modify_client_js
          
          # 验证修改结果
          if grep -q "Clash API config start" "${GENERATE_CLIENT_UC}" && \
             grep -q "Clash API config end" "${GENERATE_CLIENT_UC}" && \
             grep -q "clash_api: {" "${GENERATE_CLIENT_UC}"; then
            echo "✓ generate_client.uc 修改成功"
          else
            echo "✗ generate_client.uc 修改失败"
            exit 1
          fi
          
          if grep -q "Clash API settings start" "${CLIENT_JS}" && \
             grep -q "Clash API settings end" "${CLIENT_JS}"; then
            echo "✓ client.js 修改成功"
          else
            echo "✗ client.js 修改失败"
            exit 1
          fi
          
          # 恢复原始路径
          GENERATE_CLIENT_UC="${ORIGINAL_GENERATE_CLIENT_UC}"
          CLIENT_JS="${ORIGINAL_CLIENT_JS}"
          
          # 清理测试文件
          rm -f /tmp/generate_client.uc.test /tmp/client.js.test

  # 检查关键标记
  marker-check:
    name: Marker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required markers in generate_client.uc
        run: |
          echo "检查 generate_client.uc 中的关键标记..."
          FILE="root/etc/homeproxy/scripts/generate_client.uc"
          
          MARKERS=("Experimental start" "Experimental end" "Clash API config start" "Clash API config end")
          for marker in "${MARKERS[@]}"; do
            if grep -q "${marker}" "${FILE}"; then
              echo "  ✓ 找到标记: ${marker}"
            else
              echo "  ⚠️  未找到标记: ${marker}"
            fi
          done

      - name: Check required markers in client.js
        run: |
          echo "检查 client.js 中的关键标记..."
          FILE="htdocs/luci-static/resources/view/homeproxy/client.js"
          
          MARKERS=("Custom routing settings start" "Custom routing settings end")
          for marker in "${MARKERS[@]}"; do
            if grep -q "${marker}" "${FILE}"; then
              echo "  ✓ 找到标记: ${marker}"
            else
              echo "  ⚠️  未找到标记: ${marker}"
            fi
          done

  # 文件完整性检查
  file-integrity-check:
    name: File Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check all required files exist
        run: |
          echo "检查所有必需文件..."
          
          REQUIRED_FILES=(
            "scripts/clash-api/add_clash_api.sh"
            "scripts/clash-api/remove_clash_api.sh"
            "scripts/clash-api/verify_installation.sh"
            "scripts/clash-api/test_install.sh"
            "scripts/clash-api/check_upstream_changes.sh"
            "scripts/clash-api/config/clash_api.conf"
            "scripts/clash-api/config/version_map.txt"
            "scripts/clash-api/lib/common.sh"
            "scripts/clash-api/lib/version_checker.sh"
            "scripts/clash-api/lib/config_manager.sh"
            "scripts/clash-api/lib/file_modifier.sh"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "${file}" ]; then
              echo "  ✓ ${file}"
            else
              echo "  ✗ ${file} 不存在"
              exit 1
            fi
          done

      - name: Check file permissions
        run: |
          echo "检查文件权限..."
          
          # 检查所有 .sh 文件是否有执行权限
          find scripts/clash-api -name "*.sh" -type f | while read file; do
            if [ -x "${file}" ]; then
              echo "  ✓ ${file} 有执行权限"
            else
              echo "  ⚠️  ${file} 没有执行权限"
            fi
          done

  # 安全性检查
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data
        run: |
          echo "检查敏感数据..."
          
          # 检查是否有硬编码的密码或密钥
          if grep -rE "(password|secret|key).*=.*['\"][^'\"]{8,}" scripts/clash-api/; then
            echo "⚠️  发现可能的硬编码敏感数据"
          else
            echo "  ✓ 未发现硬编码敏感数据"
          fi

      - name: Check for dangerous commands
        run: |
          echo "检查危险命令..."
          
          # 检查是否有 rm -rf / 或类似的危险命令
          if grep -rE "rm\s+-rf\s+(/|~|\$HOME)" scripts/clash-api/ | grep -v "BACKUP_DIR\|backup\|#"; then
            echo "⚠️  发现潜在的危险命令（rm -rf / 或类似）"
            grep -rnE "rm\s+-rf\s+(/|~|\$HOME)" scripts/clash-api/ | grep -v "BACKUP_DIR\|backup\|#"
            exit 1
          fi
          
          # 检查未经验证的 eval 使用
          if grep -rE "eval\s+\\\$|eval\s+\$\(" scripts/clash-api/*.sh | grep -v "^\s*#"; then
            echo "⚠️  发现未经验证的 eval 使用（可能导致 Shell 注入）"
            grep -rnE "eval\s+\\\$|eval\s+\$\(" scripts/clash-api/*.sh | grep -v "^\s*#"
            exit 1
          fi
          
          # 检查路径遍历风险（../）
          if grep -rE '\.\./\.\.' scripts/clash-api/*.sh | grep -v "^\s*#"; then
            echo "⚠️  发现可能的路径遍历模式"
            grep -rnE '\.\./\.\.' scripts/clash-api/*.sh | grep -v "^\s*#"
            exit 1
          fi
          
          echo "  ✓ 未发现危险命令"

  # 上游同步后应用补丁
  apply-patch-after-sync:
    name: Apply Clash API Patch After Sync
    runs-on: ubuntu-latest
    if: github.event.workflow_run && github.event.workflow_run.conclusion == 'success'
    needs: [syntax-check, script-logic-test, marker-check, file-integrity-check, security-check]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils

      - name: Load configuration
        run: |
          source scripts/clash-api/config/clash_api.conf
          echo "PROJECT_ROOT=${PROJECT_ROOT}" >> $GITHUB_ENV

      - name: Check if patch is needed
        id: check_patch
        run: |
          # 检查是否已经安装了 Clash API
          if grep -q "clash_api" "${PROJECT_ROOT}/root/etc/homeproxy/scripts/generate_client.uc"; then
            echo "patch_needed=false" >> $GITHUB_OUTPUT
            echo "Clash API 已经安装，无需重新应用补丁"
          else
            echo "patch_needed=true" >> $GITHUB_OUTPUT
            echo "Clash API 未安装，需要应用补丁"
          fi

      - name: Apply Clash API patch
        if: steps.check_patch.outputs.patch_needed == 'true'
        run: |
          echo "=== 开始应用 Clash API 补丁 ==="

          # 加载脚本
          source scripts/clash-api/config/clash_api.conf
          source scripts/clash-api/lib/common.sh
          source scripts/clash-api/lib/version_checker.sh
          source scripts/clash-api/lib/config_manager.sh
          source scripts/clash-api/lib/file_modifier.sh

          # 设置环境变量
          export PROJECT_ROOT="${PROJECT_ROOT}"
          export SCRIPT_DIR="${PROJECT_ROOT}/scripts/clash-api"
          export GENERATE_CLIENT_UC="${PROJECT_ROOT}/root/etc/homeproxy/scripts/generate_client.uc"
          export CLIENT_JS="${PROJECT_ROOT}/htdocs/luci-static/resources/view/homeproxy/client.js"
          export UCI_CONFIG="${PROJECT_ROOT}/root/etc/config/homeproxy"

          # 创建备份
          echo "创建备份..."
          BACKUP_DIR=$(create_backup)
          echo "备份目录: ${BACKUP_DIR}"

          # 应用补丁
          echo "应用补丁..."
          modify_generate_client_uc
          modify_client_js

          # 生成并应用 UCI 配置
          echo "应用 UCI 配置..."
          CLASH_API_ENABLED="0"
          CLASH_API_CONTROLLER="127.0.0.1:9090"
          CLASH_API_UI="/etc/homeproxy/ui/"
          CLASH_API_UI_DETOUR=""
          CLASH_API_DEFAULT_MODE="rule"
          CLASH_API_SECRET=""

          apply_uci_config

          # 验证修改
          echo "验证修改..."
          if ! grep -q "clash_api" "${GENERATE_CLIENT_UC}"; then
            echo "错误: generate_client.uc 修改失败"
            exit 1
          fi

          if ! grep -q "Clash API settings" "${CLIENT_JS}"; then
            echo "错误: client.js 修改失败"
            exit 1
          fi

          echo "✓ 补丁应用成功"

      - name: Commit and push changes
        if: steps.check_patch.outputs.patch_needed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add root/etc/homeproxy/scripts/generate_client.uc
          git add htdocs/luci-static/resources/view/homeproxy/client.js
          git add root/etc/config/homeproxy
          git add scripts/clash-api/

          git commit -m | cat << 'EOF'
          chore: apply Clash API patch after upstream sync

          - Added Clash API configuration support
          - Updated generate_client.uc with Clash API settings
          - Added Clash API configuration UI in client.js
          - Applied UCI configuration for Clash API
          EOF

          # 切换到 with-clash-api 分支并推送
          git checkout -B with-clash-api
          git push -f origin with-clash-api

  # 综合测试报告
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [syntax-check, script-logic-test, marker-check, file-integrity-check, security-check, apply-patch-after-sync]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Clash API 脚本测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 语法检查: ${{ needs.syntax-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 脚本逻辑测试: ${{ needs.script-logic-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 标记检查: ${{ needs.marker-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 文件完整性检查: ${{ needs.file-integrity-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 安全性检查: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 补丁应用: ${{ needs.apply-patch-after-sync.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 使用说明" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "这些脚本需要在 ImmortalWrt/OpenWrt 环境中运行。" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Actions 只能进行基础的语法和逻辑测试。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "实际使用步骤：" >> $GITHUB_STEP_SUMMARY
          echo "1. 将脚本上传到路由器" >> $GITHUB_STEP_SUMMARY
          echo "2. 运行: \`bash add_clash_api.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 验证: \`bash verify_installation.sh\`" >> $GITHUB_STEP_SUMMARY

      - name: Overall status
        run: |
          # 检查所有核心测试是否通过
          if [ "${{ needs.syntax-check.result }}" != "success" ]; then
            echo "✗ 语法检查失败"
            exit 1
          fi
          
          if [ "${{ needs.script-logic-test.result }}" != "success" ]; then
            echo "✗ 脚本逻辑测试失败"
            exit 1
          fi
          
          if [ "${{ needs.marker-check.result }}" != "success" ]; then
            echo "✗ 标记检查失败"
            exit 1
          fi
          
          if [ "${{ needs.file-integrity-check.result }}" != "success" ]; then
            echo "✗ 文件完整性检查失败"
            exit 1
          fi
          
          if [ "${{ needs.security-check.result }}" != "success" ]; then
            echo "✗ 安全性检查失败"
            exit 1
          fi
          
          # apply-patch-after-sync 可能为 skipped (push 事件时)
          PATCH_RESULT="${{ needs.apply-patch-after-sync.result }}"
          if [ "${PATCH_RESULT}" = "success" ] || [ "${PATCH_RESULT}" = "skipped" ]; then
            echo "✓ 所有测试通过"
            exit 0
          else
            echo "✗ 补丁应用失败: ${PATCH_RESULT}"
            exit 1
          fi